name: Build LDRM Executables

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      
      - name: Build Windows exe
        run: |
          pyinstaller --clean --windowed --onefile --name LDRM main.py
      
      - name: Upload Windows exe
        uses: actions/upload-artifact@v3
        with:
          name: LDRM-Windows
          path: dist/LDRM.exe
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      
      - name: Build macOS app
        run: |
          pyinstaller --clean --windowed --onedir --name LDRM main.py
      
      - name: Create DMG (optional)
        run: |
          cd dist && hdiutil create -volname LDRM -srcfolder LDRM.app -ov -format UDZO LDRM.dmg || true
      
      - name: Upload macOS app
        uses: actions/upload-artifact@v3
        with:
          name: LDRM-macOS
          path: dist/LDRM.app
          retention-days: 30
      
      - name: Upload macOS DMG (if created)
        uses: actions/upload-artifact@v3
        with:
          name: LDRM-macOS-DMG
          path: dist/LDRM.dmg
          retention-days: 30
